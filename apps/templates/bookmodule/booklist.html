{% extends "bookmodule/layouts/base.html" %}
{% block title %}
Book List
{% endblock title %}

{% block content %}

<h2>Search Results</h2>

<table border="1">

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Author</th>
</tr>

{% for book in books %}

<tr>
    <td>{{ book.id }}</td>
    <td>{{ book.title }}</td>
    <td>{{ book.author }}</td>
</tr>

{% empty %}

<tr>
    <td colspan="3">
        No books found.
    </td>
</tr>

{% endfor %}

</table>

{% endblock content %}
