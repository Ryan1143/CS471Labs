{% extends "bookmodule/layouts/base.html" %}

{% block content %}

<h2>Task 3 Results</h2>

<table border="1">

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Author</th>
    <th>Edition</th>
    <th>Price</th>
</tr>


{% for book in books %}

<tr>
    <td>{{ book.id }}</td>
    <td>{{ book.title }}</td>
    <td>{{ book.author }}</td>
    <td>{{ book.edition }}</td>
    <td>{{ book.price }}</td>
</tr>

{% empty %}

<tr>
    <td colspan="5">
        No books found.
    </td>
</tr>

{% endfor %}


</table>

{% endblock content %}
